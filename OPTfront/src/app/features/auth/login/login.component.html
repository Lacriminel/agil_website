<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-blue-700">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="text-4xl font-bold text-blue-800 mb-1">AGIL</div>
      <div class="text-gray-500 text-sm">Gestion de Distribution de Carburant</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse e-mail</label>
        <input
          type="email"
          formControlName="email"
          placeholder="vous@agil.tn"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <p class="text-red-500 text-xs mt-1">Veuillez saisir un e-mail valide</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <p class="text-red-500 text-xs mt-1">Mot de passe requis (6 caractères minimum)</p>
        }
      </div>

      @if (error) {
        <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-2.5 text-red-600 text-sm">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        [disabled]="form.invalid || loading"
        class="w-full bg-blue-700 hover:bg-blue-800 disabled:opacity-50 text-white font-semibold py-2.5 rounded-lg transition-colors"
      >
        {{ loading ? 'Connexion en cours…' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
