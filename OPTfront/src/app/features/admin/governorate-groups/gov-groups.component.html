<div class="p-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Groupes de gouvernorats</h1>
    <button (click)="openCreate()" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-800">+ Ajouter un groupe</button>
  </div>
  @if (showForm) {
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
        <h2 class="text-lg font-semibold mb-4">{{ editId ? 'Modifier' : 'Ajouter' }} un groupe</h2>
        <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
          <input formControlName="name" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Nom du groupe (ex: Nord)" />
          @if (error) { <p class="text-red-500 text-sm">{{ error }}</p> }
          <div class="flex gap-3">
            <button type="submit" [disabled]="form.invalid" class="flex-1 bg-blue-700 text-white rounded-lg py-2 text-sm disabled:opacity-50">Enregistrer</button>
            <button type="button" (click)="showForm=false" class="flex-1 border rounded-lg py-2 text-sm">Annuler</button>
          </div>
        </form>
      </div>
    </div>
  }
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
        <tr>
          <th class="px-6 py-3 text-left">ID</th>
          <th class="px-6 py-3 text-left">Nom</th>
          <th class="px-6 py-3 text-left">Gouvernorats</th>
          <th class="px-6 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        @for (g of groups; track g.id) {
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-3 text-gray-400">#{{ g.id }}</td>
            <td class="px-6 py-3 font-medium text-gray-800">{{ g.name }}</td>
            <td class="px-6 py-3 text-gray-500">{{ g.governorates?.length ?? 0 }}</td>
            <td class="px-6 py-3 text-right space-x-2">
              <button (click)="openEdit(g)" class="text-blue-600 hover:underline text-xs">Modifier</button>
              <button (click)="delete(g.id)" class="text-red-500 hover:underline text-xs">Supprimer</button>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Aucun groupe enregistré</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
