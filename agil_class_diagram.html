
<style>
#cd{padding:.5rem 0}
#cd svg.classDiagram .row-rect-odd path,
#cd svg.classDiagram .row-rect-even path,
#cd svg.classDiagram .row-rect-odd rect,
#cd svg.classDiagram .row-rect-even rect{stroke:none !important}
#cd svg.classDiagram .divider path{stroke-opacity:.5}
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad:false,
  theme:'base',
  fontFamily:'"Anthropic Sans", sans-serif',
  themeVariables:{
    darkMode:dark,
    fontSize:'13px',
    fontFamily:'"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
  class User {
    +int id
    +string email
    +string password
    +string role
    +login()
    +logout()
  }
  class Admin {
    +manageTruck()
    +manageGovernorate()
    +managePlace()
    +manageCustomer()
    +confirmOrder()
    +setTruckStatus()
  }
  class Customer {
    +int id
    +string fullName
    +string phone
    +int placeId
    +browseTrucks()
    +placeOrder()
    +viewOrders()
  }
  class Governorate {
    +int id
    +string name
    +int groupId
  }
  class GovernorateGroup {
    +int id
    +string name
  }
  class Place {
    +int id
    +string name
    +int governorateId
    +int customerId
  }
  class Truck {
    +int id
    +string name
    +int totalCapacity
    +string status
    +int governorateGroupId
    +getAvailableCompartments()
    +updateStatus()
  }
  class Compartment {
    +int id
    +int truckId
    +int position
    +int capacity
    +string gasType
    +bool isAvailable
  }
  class GasType {
    <<enumeration>>
    GASOIL
    GASOIL_SSP
    GASOIL_SSF
  }
  class TruckStatus {
    <<enumeration>>
    AVAILABLE
    IN_TRANSIT
    MAINTENANCE
  }
  class OrderStatus {
    <<enumeration>>
    PENDING
    CONFIRMED
    DELIVERED
  }
  class Order {
    +int id
    +int customerId
    +datetime createdAt
    +string status
    +int totalQuantity
    +confirm()
    +deliver()
  }
  class OrderItem {
    +int id
    +int orderId
    +int compartmentId
    +string gasType
    +int quantity
  }
  User <|-- Admin
  User <|-- Customer
  Customer "1" -- "1" Place : owns
  Place "1..*" -- "1" Governorate : located in
  Governorate "1..*" -- "1" GovernorateGroup : grouped in
  Truck "*" -- "1" GovernorateGroup : serves
  Truck "1" *-- "6..7" Compartment : contains
  Compartment ..> GasType : uses
  Truck ..> TruckStatus : has
  Customer "1" -- "*" Order : places
  Order "1" *-- "1..*" OrderItem : contains
  OrderItem "*" -- "1" Compartment : reserves
  OrderItem ..> GasType : type
  Order ..> OrderStatus : has`;
const {svg} = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;
document.querySelectorAll('#cd svg.classDiagram .row-rect-odd path, #cd svg.classDiagram .row-rect-even path').forEach(p=>p.setAttribute('stroke','none'));
</script>
